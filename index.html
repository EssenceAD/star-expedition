<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>별의 원정대 (가제)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@800;900&family=Gowun+Batang:wght@700&family=Luckiest+Guy&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" />
<link rel="stylesheet" href="/src/style.css" />
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="hud" hidden>
    <div id="tl">
      <button id="bAuto" class="rb" aria-pressed="false" title="자동 전투"><span>자동</span></button>
      <button id="bSpeed" class="rb" title="배속"><span>×1</span></button>
    </div>
    <div id="stg"></div>
    <div id="tr">
      <button id="bPause" class="rb" aria-pressed="false" title="일시정지"></button>
      <button id="bQuit" class="rb" title="포기"></button>
    </div>
    <div id="pausedTag" hidden>일시정지</div>
    <div id="boss" hidden>
      <div class="bp"></div>
      <div class="bi">
        <div class="bn"><b id="bName">보스</b><span id="bPct">100%</span></div>
        <div class="bh"><i id="bHp"></i><em id="bHpN"></em></div>
        <div class="bs"><span>누적 피해 <b id="bDmg">0</b></span><span>남은 시간 <b id="bTime">3:00</b></span></div>
      </div>
    </div>
    <div id="raidHud" hidden><div id="rParts"></div><div class="gg"><span>그로기</span><div class="bh"><i id="rGg"></i></div><em id="rDown"></em></div></div>
    <button id="bDodge" hidden>줄 바꾸기</button>
    <div id="wave">WAVE 1</div>
    <div id="warn" hidden></div>
    <div id="dps"><button id="bDps" title="DPS"></button><div id="dpsL"></div></div>
    <div id="bar"></div>
    <div id="result" hidden></div>
  </div>
  <div id="ui"></div>
  <div id="topbar" class="top" hidden></div>
  <div id="ticker" hidden></div>
</div>
<div id="loading"></div>
<div id="rotate"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
